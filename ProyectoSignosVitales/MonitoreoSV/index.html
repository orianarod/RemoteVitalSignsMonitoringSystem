<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>LOGIN</title>

  <!--Inclusión de librerías bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>

</head>

<body class="bg-dark">
  <div class="container" align='center'>
    <div class="card mt-5" style="width: 18em;">
      <div class='card-body'>
        <h3 class='card-title mb-4'>Sistema de Monitoreo de Signos Vitales</h3>
        <h6 class='card-subtitle mb-3 text-muted'>Inicia sesión en el sistema</h6>
        <form class='card-text' id="login-form" action='inicio.js' method="post">
          <input type="text" id="usuario" placeholder="Usuario" class="mb-2">
          <input type="password" id="contrasena" placeholder="Contraseña" class="mb-2">
          <button type="submit" class="btn btn-info text-center text-muted mt-2">Ingresar</button>
          <div class="row mt-2" id="loginError"> </div>
        </form>
      </div>
    </div>
  </div>

  <!--Iclusión de librería JQuery-->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

  <!--Inclusión de código JS con las funciones de la página-->
  <script src='Login/login.js'> </script>

</body>

</html>
