<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Monitoreo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>


</head>

<body>

  <nav class='navbar navbar-lg navbar-dark bg-dark'>
    <div class="container-fluid">
      <div class="col-lg-6">
        <a href="#" class="navbar-brand ml-auto text-light"> Sistema de Monitoreo de Signos Vitales </a>
      </div>
      <div class="col-lg-6" align='right'>
        <div class="col-lg-3">
          <a class="text-light" id=nombreUsuario></a>
        </div>
        <div class="col-lg-3">
          <button class="btn btn-outline-secondary ml-1" type="submit" id='logout-btn'> Cerrar Sesion </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid" id="infoPaciente">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title" align='left' id="info-nombre"> <i></i> </h4>
        <h5 clase="card-subtitle" id='info-condicion'> </h5>

        <table class='table mt-2 table-responsive' style="overflow: scroll" id="tablaRegistros">
          <thead align="center">
            <tr>
              <th scope='col'>Fecha y hora</th>
              <th scope='col'>Presion Arterial</th>
              <th scope='col'>Pulso Cardíaco</th>
              <th scope='col'>Temperatura</th>
              <th scope='col'>Alerta</th>
            </tr>
          </thead>
          <tbody align='center' id='registrosPaciente'>
          </tbody>
        </table>
        <h6 class="bg-danger text-light" id='noRegistros'>No hay registros disponibles</h6>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

  <script src='../Paciente/paciente.js'></script>

</body>

</html>
